# Installed to /etc/nginx/snippets/osb-proxy.conf and re-synced on every deploy.
# The site file is owned by certbot after the first --nginx run, so all
# repo-managed proxy settings live here instead.
client_max_body_size 512m;

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # websockets + streamed command output
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
