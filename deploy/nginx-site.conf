# Installed once to /etc/nginx/sites-available/osb.gerege.mn.
# certbot --nginx takes ownership afterwards (adds the 443 block + redirect),
# so deploy.sh never overwrites this file again.
server {
    listen 80;
    listen [::]:80;
    server_name osb.gerege.mn;

    include snippets/osb-proxy.conf;
}
